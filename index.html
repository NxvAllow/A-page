.pajaro {
    width: 46px;
    height: 34px;

    position: absolute;
    z-index: 1;

    background: url('img/pajaro.png');
    background-repeat: no-repeat;
    background-size: 92px 34px;
    background-position-x: 0px;

    animation: aletear 0.4s steps(2) infinite;
}

@keyframes aletear {
    from{
        background-position-x: 0px;
    }
    to{
        background-position-x: -46px;
    }
}

.suelo {
    width: 200%;
    height: 42px;

    position: absolute;
    bottom: 0;
    left: 0;

    background: url(img/suelo.png) repeat-x 0px 0px;
    background-size: 50% 42px;

}

.cactus{
    width: 46px;
    height: 96px;

    position: absolute;
    bottom: 16px;
    left: 600px;
    z-index: 1;

    background: url(img/cactus1.png) no-repeat;
}
.cactus2{
    width: 98px;
    height: 66px;

    background: url(img/cactus2.png) no-repeat;
}

.nube{
    width: 92px;
    height: 26px;

    position: absolute;
    z-index: 0;

    background: url(img/nube.png) no-repeat;
    background-size: 92px 26px;
}

.score{
    width: 100px;
    height: 30px;

    position: absolute;
    top: 5px;
    right: 15px;
    z-index: 10;

    color: #d48871;
    font-family: Verdana;
    font-size: 30px;
    font-weight: bold;
    text-align: right;
}

.game-over{
    display: none;

    position: absolute;
    width: 100%;


    text-align: center;
    color: #7e928b;
    font-size: 30px;
    font-family: Verdana;
    font-weight: 700;
}

@keyframes animarDino{
    0%, 49.99%{
        background-position-x: 0px;
    }
    50%, 100%{
        background-position-x: -53px;
    }
}

<script>

}else{

function Init() {
    time = new Date();

    Loop();
}

function Loop() {
    deltaTime = (new Date() - time) / 1000;

    Update();
    requestAnimationFrame(Loop);
}

// ---- Separación mínima entre CUALQUIER obstáculo (cactus o pájaro) ----
var distanciaMinimaObstaculos = 300; // px mínimos entre el inicio de un obstáculo y el siguiente
var tiempoDesdeUltimoObstaculo = 999; // arranca alto para permitir el primer spawn

var contenedor;
var dino;
var textoScore;
var suelo;
var gameOver;

function Start() {
    gameOver = document.querySelector(".game-over");
    suelo = document.querySelector(".suelo");
    contenedor = document.querySelector(".contenedor");
    textoScore = document.querySelector(".score");
    dino = document.querySelector(".dino");
    document.addEventListener("keydown", HandleKeyDown);
    document.addEventListener("keyup", HandleKeyUp);
}

function Update() {
    if(parado) return;
    
    MoverDinosaurio();
    MoverSuelo();
    DecidirCrearObstaculos();
    DecidirCrearNubes();
    DecidirCrearPajaros();
    MoverObstaculos();
    MoverNubes();
    MoverPajaros();
    DetectarColision();

    tiempoDesdeUltimoObstaculo += deltaTime;
    velY -= gravedad * deltaTime;
}

function HandleKeyDown(ev){
    if(ev.keyCode == 32 || ev.keyCode == 38 || ev.keyCode == 40){
        ev.preventDefault();
    }
    if(ev.keyCode == 32 || ev.keyCode == 38){
        Saltar();
    }
    if(ev.keyCode == 40){
        Agacharse();
    }
}

function HandleKeyUp(ev){
    if(ev.keyCode == 40){
        Levantarse();
    }
}

function Saltar(){
    if(agachado) return; // no se puede saltar mientras está agachado
    if(dinoPosY === sueloY){
        saltando = true;
        velY = impulso;
        dino.classList.remove("dino-corriendo");
    }
}

function Agacharse(){
    if(agachado) return;
    agachado = true;

    if(dinoPosY === sueloY){
        // agachado en el suelo: reduce la altura de colisión y el sprite
        dino.classList.add("dino-agachado");
    }else if(saltando){
        // agachado en el aire: cae más rápido (caída rápida)
        velY -= 700;
    }
}

function Levantarse(){
    agachado = false;
    dino.classList.remove("dino-agachado");
}

function MoverDinosaurio() {
    dinoPosY += velY * deltaTime;
    if(dinoPosY < sueloY){
        
        TocarSuelo();
    }
    dino.style.bottom = dinoPosY+"px";
}

function TocarSuelo() {
    dinoPosY = sueloY;
    velY = 0;
    if(saltando){
        dino.classList.add("dino-corriendo");
    }
    saltando = false;
}

function MoverSuelo() {
    sueloX += CalcularDesplazamiento();
    suelo.style.left = -(sueloX % contenedor.clientWidth) + "px";
}

function CalcularDesplazamiento() {
    return velEscenario * deltaTime * gameVel;
}

function Estrellarse() {
    dino.classList.remove("dino-corriendo");
    dino.classList.add("dino-estrellado");
    parado = true;
}

function DecidirCrearObstaculos() {
    tiempoHastaObstaculo -= deltaTime;
    if(tiempoHastaObstaculo <= 0 && PuedeCrearObstaculo()) {
        CrearObstaculo();
    }
}

function PuedeCrearObstaculo() {
    var gapTiempoMinimo = distanciaMinimaObstaculos / (velEscenario * gameVel);
    return tiempoDesdeUltimoObstaculo >= gapTiempoMinimo;
}

function DecidirCrearNubes() {
    tiempoHastaNube -= deltaTime;
    if(tiempoHastaNube <= 0) {
        CrearNube();
    }
}

function CrearObstaculo() {
    var obstaculo = document.createElement("div");
    contenedor.appendChild(obstaculo);
    obstaculo.classList.add("cactus");
    if(Math.random() > 0.5) obstaculo.classList.add("cactus2");
    obstaculo.posX = contenedor.clientWidth;
    obstaculo.style.left = contenedor.clientWidth+"px";

    obstaculos.push(obstaculo);
    tiempoHastaObstaculo = tiempoObstaculoMin + Math.random() * (tiempoObstaculoMax-tiempoObstaculoMin) / gameVel;
    tiempoDesdeUltimoObstaculo = 0;
}

function CrearNube() {
    var nube = document.createElement("div");
    contenedor.appendChild(nube);
    nube.classList.add("nube");
    nube.posX = contenedor.clientWidth;
    nube.style.left = contenedor.clientWidth+"px";
    nube.style.bottom = minNubeY + Math.random() * (maxNubeY-minNubeY)+"px";
    
    nubes.push(nube);
    tiempoHastaNube = tiempoNubeMin + Math.random() * (tiempoNubeMax-tiempoNubeMin) / gameVel;
}

function DecidirCrearPajaros() {
    if(score < scoreMinimoPajaro) return;
    tiempoHastaPajaro -= deltaTime;
    if(tiempoHastaPajaro <= 0 && PuedeCrearObstaculo()) {
        CrearPajaro();
    }
}

function CrearPajaro() {
    var pajaro = document.createElement("div");
    contenedor.appendChild(pajaro);
    pajaro.classList.add("pajaro");
    pajaro.posX = contenedor.clientWidth;
    pajaro.style.left = contenedor.clientWidth+"px";
    pajaro.style.bottom = pajaroPosY+"px";

    pajaros.push(pajaro);
    tiempoHastaPajaro = tiempoPajaroMin + Math.random() * (tiempoPajaroMax-tiempoPajaroMin) / gameVel;
    tiempoDesdeUltimoObstaculo = 0;
}

function MoverObstaculos() {
    for (var i = obstaculos.length - 1; i >= 0; i--) {
        if(obstaculos[i].posX < -obstaculos[i].clientWidth) {
            obstaculos[i].parentNode.removeChild(obstaculos[i]);
            obstaculos.splice(i, 1);
            GanarPuntos();
        }else{
            obstaculos[i].posX -= CalcularDesplazamiento();
            obstaculos[i].style.left = obstaculos[i].posX+"px";
        }
    }
}

function MoverNubes() {
    for (var i = nubes.length - 1; i >= 0; i--) {
        if(nubes[i].posX < -nubes[i].clientWidth) {
            nubes[i].parentNode.removeChild(nubes[i]);
            nubes.splice(i, 1);
        }else{
            nubes[i].posX -= CalcularDesplazamiento() * velNube;
            nubes[i].style.left = nubes[i].posX+"px";
        }
    }
}

function MoverPajaros() {
    for (var i = pajaros.length - 1; i >= 0; i--) {
        if(pajaros[i].posX < -pajaros[i].clientWidth) {
            pajaros[i].parentNode.removeChild(pajaros[i]);
            pajaros.splice(i, 1);
        }else{
            pajaros[i].posX -= CalcularDesplazamiento();
            pajaros[i].style.left = pajaros[i].posX+"px";
        }
    }
}

function GanarPuntos() {
    score++;
    textoScore.innerText = score;

    // la velocidad sube de forma progresiva con cada punto, no a saltos
    gameVel = Math.min(gameVelBase + score * gameVelIncremento, gameVelMax);
    suelo.style.animationDuration = (3/gameVel)+"s";

    if(score == 5){
        contenedor.classList.add("mediodia");
    }else if(score == 10) {
        contenedor.classList.add("tarde");
    } else if(score == 20) {
        contenedor.classList.add("noche");
    }
}

function GameOver() {
    Estrellarse();
    gameOver.style.display = "block";
}

function DetectarColision() {
    for (var i = 0; i < obstaculos.length; i++) {
        if(obstaculos[i].posX > dinoPosX + dino.clientWidth) {
            //EVADE
            break; //al estar en orden, no puede chocar con más
        }else{
            if(IsCollision(dino, obstaculos[i], 10, 19, 15, 13)) {
                GameOver();
            }
        }
    }

    for (var j = 0; j < pajaros.length; j++) {
        if(pajaros[j].posX > dinoPosX + dino.clientWidth) {
            break;
        }else{
            if(IsCollision(dino, pajaros[j], 6, 10, 6, 10)) {
                GameOver();
            }
        }
    }
}

function IsCollision(a, b, paddingTop, paddingRight, paddingBottom, paddingLeft) {
    var aRect = a.getBoundingClientRect();
    var bRect = b.getBoundingClientRect();

    return !(
        ((aRect.top + aRect.height - paddingBottom) < (bRect.top)) ||
        (aRect.top + paddingTop > (bRect.top + bRect.height)) ||
        ((aRect.left + aRect.width - paddingRight) < bRect.left) ||
        (aRect.left + paddingLeft > (bRect.left + bRect.width))
    );
}


</script>
</body>
</html>
